services:
  postgres:
    image: postgres:16
    container_name: lpk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lpk}
      POSTGRES_USER: ${POSTGRES_USER:-lpk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - lpk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lpk_user} -d ${POSTGRES_DB:-lpk}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lpk_postgres_data: