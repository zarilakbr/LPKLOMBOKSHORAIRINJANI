<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LPK Lombok Shorai Rinjani | Japanese Language Education School</title>
    <meta name="description" content="LPK Lombok Shorai Rinjani - Lembaga Pelatihan Kerja (LPK) Bahasa Jepang terkemuka. Pendidikan terarah, persiapan JLPT, Tokutei Ginou (SSW), dan bimbingan karier terpercaya menuju Jepang." />
    
    <!-- Google Fonts: Quicksand (Global) & Noto Serif JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="/assets/brand/logo.png" />
    <script>
      (function() {
        try {
          localStorage.removeItem('theme');
          document.documentElement.removeAttribute('data-theme');
          var savedLang = localStorage.getItem('app_language');
          if (savedLang) {
            document.documentElement.setAttribute('lang', savedLang === 'JP' ? 'ja' : savedLang.toLowerCase());
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
