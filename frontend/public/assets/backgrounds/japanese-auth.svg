<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --auth-sky-top: #F9F5EE;
        --auth-sky-mid: #FBF7F2;
        --auth-sky-bot: #EBF2F8;
        --auth-water-top: #E5EEF6;
        --auth-water-bot: #F8F4EE;
        --auth-sun: #F7B5A6;
        --auth-sun-halo: rgba(247, 181, 166, 0.28);
        --auth-cloud: rgba(255, 255, 255, 0.65);
        --auth-fuji-body: #B9CAD8;
        --auth-fuji-snow: #FFFFFF;
        --auth-fuji-shade: #D6E3EE;
        --auth-ridge: #9FB3C3;
        --auth-hill: #3E4856;
        --auth-torii: #C53030;
        --auth-torii-beam: #A82424;
        --auth-pagoda: #2B3545;
        --auth-pagoda-accent: #C53030;
        --auth-pagoda-roof: #1E2837;
        --auth-branch: #42352B;
        --auth-sakura-petal: #F8BBD0;
        --auth-sakura-light: #FDE8ED;
        --auth-sakura-core: #C53030;
        --auth-ripple: rgba(71, 85, 105, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --auth-sky-top: #0B0F19;
          --auth-sky-mid: #101625;
          --auth-sky-bot: #162033;
          --auth-water-top: #0E1524;
          --auth-water-bot: #080D18;
          --auth-sun: #E2E8F0;
          --auth-sun-halo: rgba(226, 232, 240, 0.16);
          --auth-cloud: rgba(51, 65, 85, 0.32);
          --auth-fuji-body: #1E293B;
          --auth-fuji-snow: #94A3B8;
          --auth-fuji-shade: #334155;
          --auth-ridge: #141D2D;
          --auth-hill: #0F172A;
          --auth-torii: #992424;
          --auth-torii-beam: #7A1C1C;
          --auth-pagoda: #0F172A;
          --auth-pagoda-accent: #992424;
          --auth-pagoda-roof: #0B111E;
          --auth-branch: #261F1A;
          --auth-sakura-petal: #B8728A;
          --auth-sakura-light: #DDA0B4;
          --auth-sakura-core: #992424;
          --auth-ripple: rgba(148, 163, 184, 0.12);
        }
      }
    </style>
    <linearGradient id="authSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--auth-sky-top, #F9F5EE)" />
      <stop offset="42%" stop-color="var(--auth-sky-mid, #FBF7F2)" />
      <stop offset="70%" stop-color="var(--auth-sky-bot, #EBF2F8)" />
      <stop offset="71%" stop-color="var(--auth-water-top, #E5EEF6)" />
      <stop offset="100%" stop-color="var(--auth-water-bot, #F8F4EE)" />
    </linearGradient>
    <linearGradient id="authFujiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--auth-fuji-shade, #D6E3EE)" />
      <stop offset="45%" stop-color="var(--auth-fuji-body, #B9CAD8)" />
      <stop offset="100%" stop-color="var(--auth-ridge, #9FB3C3)" />
    </linearGradient>
    <radialGradient id="authSunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--auth-sun, #F7B5A6)" stop-opacity="0.95" />
      <stop offset="70%" stop-color="var(--auth-sun, #F7B5A6)" stop-opacity="0.4" />
      <stop offset="100%" stop-color="var(--auth-sun-halo, rgba(247,181,166,0.28))" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="authPetalGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="var(--auth-sakura-light, #FDE8ED)" />
      <stop offset="75%" stop-color="var(--auth-sakura-petal, #F8BBD0)" />
      <stop offset="100%" stop-color="var(--auth-sakura-core, #C53030)" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- 1. SKY & LAKE CANVAS -->
  <rect width="1600" height="900" fill="url(#authSkyGrad)" />

  <!-- 2. CELESTIAL SUN / MOON (Upper Right) -->
  <g id="auth-celestial">
    <circle cx="1360" cy="260" r="115" fill="url(#authSunHalo)" />
    <circle cx="1360" cy="260" r="76" fill="var(--auth-sun, #F7B5A6)" opacity="0.9" />
  </g>

  <!-- 3. MINIMAL JAPANESE CLOUDS (Kumogata) -->
  <g id="auth-clouds" fill="var(--auth-cloud, rgba(255,255,255,0.65))">
    <path d="M 1210 165 h 190 a 14 14 0 0 1 0 28 h -190 a 14 14 0 0 1 0 -28 Z" opacity="0.8" />
    <path d="M 1320 215 h 150 a 11 11 0 0 1 0 22 h -150 a 11 11 0 0 1 0 -22 Z" opacity="0.65" />
    <path d="M 150 145 h 160 a 12 12 0 0 1 0 24 h -160 a 12 12 0 0 1 0 -24 Z" opacity="0.75" />
    <path d="M 60 195 h 130 a 10 10 0 0 1 0 20 h -130 a 10 10 0 0 1 0 -20 Z" opacity="0.55" />
  </g>

  <!-- 4. DISTANT MOUNTAIN RIDGES -->
  <g id="auth-distant-mountains">
    <path d="M 980 640 Q 1120 540 1260 575 T 1600 550 L 1600 645 L 980 645 Z" fill="var(--auth-ridge, #9FB3C3)" opacity="0.35" />
    <path d="M 1060 640 Q 1200 580 1370 595 T 1600 605 L 1600 645 L 1060 645 Z" fill="var(--auth-ridge, #9FB3C3)" opacity="0.5" />
  </g>

  <!-- 5. MOUNT FUJI (Right Side) -->
  <g id="auth-mount-fuji">
    <path d="M 1210 640 Q 1315 540 1370 330 L 1420 330 Q 1475 540 1590 640 Z" fill="url(#authFujiGrad)" />
    <!-- Fuji Scalloped Snowcap -->
    <path d="M 1370 330 L 1420 330 Q 1440 375 1450 405 Q 1435 395 1422 418 Q 1408 392 1395 422 Q 1382 396 1370 416 Q 1358 390 1342 405 Q 1352 375 1370 330 Z" fill="var(--auth-fuji-snow, #FFFFFF)" />
    <path d="M 1395 330 L 1420 330 Q 1440 375 1450 405 Q 1435 395 1422 418 Q 1408 392 1395 422 Z" fill="var(--auth-fuji-shade, #D6E3EE)" opacity="0.55" />
  </g>

  <!-- 6. WATER RIPPLES (Center Clear, Subtle Edge Accents) -->
  <g id="auth-water-ripples" stroke="var(--auth-ripple, rgba(71,85,105,0.18))" stroke-width="1.5" stroke-linecap="round">
    <line x1="580" y1="670" x2="680" y2="670" opacity="0.3" />
    <line x1="920" y1="680" x2="1030" y2="680" opacity="0.3" />
    <line x1="720" y1="710" x2="880" y2="710" opacity="0.25" />
    <line x1="1260" y1="685" x2="1470" y2="685" stroke-dasharray="30 12" />
    <line x1="1310" y1="715" x2="1440" y2="715" stroke-dasharray="20 8" />
    <line x1="180" y1="685" x2="350" y2="685" stroke-dasharray="25 10" />
    <line x1="220" y1="720" x2="390" y2="720" stroke-dasharray="35 15" />
  </g>

  <!-- 7. SHINTO TORII GATE (Right Water) -->
  <g id="auth-torii-gate">
    <!-- Base Stones -->
    <ellipse cx="1339" cy="714" rx="8" ry="3.5" fill="var(--auth-pagoda-roof, #1E2837)" />
    <ellipse cx="1399" cy="714" rx="8" ry="3.5" fill="var(--auth-pagoda-roof, #1E2837)" />
    <!-- Pillars -->
    <rect x="1335" y="625" width="8" height="88" rx="2" fill="var(--auth-torii, #C53030)" />
    <rect x="1395" y="625" width="8" height="88" rx="2" fill="var(--auth-torii, #C53030)" />
    <!-- Tie-Beam -->
    <rect x="1323" y="642" width="92" height="7" rx="1.5" fill="var(--auth-torii-beam, #A82424)" />
    <!-- Strut -->
    <rect x="1366" y="627" width="6" height="15" fill="var(--auth-torii-beam, #A82424)" />
    <!-- Curved Lintel -->
    <path d="M 1312 623 Q 1369 628 1426 623 L 1429 631 Q 1369 635 1309 631 Z" fill="var(--auth-torii, #C53030)" />
    <path d="M 1310 623 Q 1369 627 1428 623 L 1430 620 Q 1369 624 1308 620 Z" fill="var(--auth-pagoda-roof, #1E2837)" />
  </g>

  <!-- 8. EMBANKMENT HILL (Left Side) -->
  <g id="auth-pagoda-hill">
    <path d="M 0 640 Q 120 635 240 660 T 360 740 L 360 900 L 0 900 Z" fill="var(--auth-hill, #3E4856)" opacity="0.9" />
  </g>

  <!-- 9. 3-TIERED TRADITIONAL PAGODA (Left Side) -->
  <g id="auth-pagoda">
    <line x1="120" y1="260" x2="120" y2="335" stroke="var(--auth-pagoda, #2B3545)" stroke-width="3" stroke-linecap="round" />
    <circle cx="120" cy="260" r="4.5" fill="var(--auth-pagoda-accent, #C53030)" />
    <ellipse cx="120" cy="275" rx="5" ry="2" fill="var(--auth-pagoda, #2B3545)" />
    <ellipse cx="120" cy="283" rx="6" ry="2" fill="var(--auth-pagoda, #2B3545)" />
    <ellipse cx="120" cy="291" rx="7" ry="2.2" fill="var(--auth-pagoda, #2B3545)" />
    <ellipse cx="120" cy="299" rx="8" ry="2.2" fill="var(--auth-pagoda, #2B3545)" />
    <ellipse cx="120" cy="307" rx="8.5" ry="2.2" fill="var(--auth-pagoda, #2B3545)" />
    <!-- Tier 1 -->
    <path d="M 75 352 Q 120 342 165 352 L 157 362 Q 120 354 83 362 Z" fill="var(--auth-pagoda-roof, #1E2837)" />
    <rect x="92" y="362" width="56" height="3" fill="var(--auth-pagoda-accent, #C53030)" />
    <rect x="96" y="365" width="48" height="42" fill="var(--auth-pagoda, #2B3545)" />
    <rect x="110" y="375" width="20" height="32" fill="var(--auth-pagoda-roof, #1E2837)" />
    <!-- Tier 2 -->
    <path d="M 60 417 Q 120 405 180 417 L 171 429 Q 120 419 69 429 Z" fill="var(--auth-pagoda-roof, #1E2837)" />
    <rect x="80" y="429" width="80" height="3.5" fill="var(--auth-pagoda-accent, #C53030)" />
    <rect x="86" y="432.5" width="68" height="50" fill="var(--auth-pagoda, #2B3545)" />
    <rect x="105" y="445" width="30" height="37.5" fill="var(--auth-pagoda-roof, #1E2837)" />
    <!-- Tier 3 -->
    <path d="M 42 495 Q 120 480 198 495 L 188 509 Q 120 497 52 509 Z" fill="var(--auth-pagoda-roof, #1E2837)" />
    <rect x="68" y="509" width="104" height="4" fill="var(--auth-pagoda-accent, #C53030)" />
    <rect x="74" y="513" width="92" height="72" fill="var(--auth-pagoda, #2B3545)" />
    <rect x="96" y="530" width="48" height="55" fill="var(--auth-pagoda-roof, #1E2837)" />
    <rect x="65" y="585" width="110" height="15" rx="2" fill="var(--auth-pagoda-roof, #1E2837)" />
  </g>

  <!-- 10. SAKURA BRANCH (Top-Left Corner) -->
  <g id="auth-sakura-tree">
    <path d="M 0 55 Q 90 85 180 65 T 320 85 T 440 60" fill="none" stroke="var(--auth-branch, #42352B)" stroke-width="7" stroke-linecap="round" />
    <path d="M 140 72 Q 200 120 270 115" fill="none" stroke="var(--auth-branch, #42352B)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 260 76 Q 310 125 380 135" fill="none" stroke="var(--auth-branch, #42352B)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Blossom Flower 1 -->
    <g transform="translate(180, 65)">
      <circle cx="-8" cy="-5" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="8" cy="-5" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="-7" cy="8" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="7" cy="8" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="0" cy="-10" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="0" cy="0" r="3" fill="var(--auth-sakura-core, #C53030)" />
    </g>
    <!-- Blossom Flower 2 -->
    <g transform="translate(270, 115)">
      <circle cx="-8" cy="-5" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="8" cy="-5" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="-7" cy="8" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="7" cy="8" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="0" cy="-9" r="7.5" fill="url(#authPetalGrad)" />
      <circle cx="0" cy="0" r="2.8" fill="var(--auth-sakura-core, #C53030)" />
    </g>
    <!-- Blossom Flower 3 -->
    <g transform="translate(320, 85)">
      <circle cx="-9" cy="-5" r="8" fill="url(#authPetalGrad)" />
      <circle cx="9" cy="-5" r="8" fill="url(#authPetalGrad)" />
      <circle cx="-7" cy="9" r="8" fill="url(#authPetalGrad)" />
      <circle cx="7" cy="9" r="8" fill="url(#authPetalGrad)" />
      <circle cx="0" cy="-11" r="8" fill="url(#authPetalGrad)" />
      <circle cx="0" cy="0" r="3.2" fill="var(--auth-sakura-core, #C53030)" />
    </g>
    <!-- Blossom Flower 4 -->
    <g transform="translate(420, 65)">
      <circle cx="-7" cy="-4" r="6.5" fill="url(#authPetalGrad)" />
      <circle cx="7" cy="-4" r="6.5" fill="url(#authPetalGrad)" />
      <circle cx="-6" cy="7" r="6.5" fill="url(#authPetalGrad)" />
      <circle cx="6" cy="7" r="6.5" fill="url(#authPetalGrad)" />
      <circle cx="0" cy="-8" r="6.5" fill="url(#authPetalGrad)" />
      <circle cx="0" cy="0" r="2.5" fill="var(--auth-sakura-core, #C53030)" />
    </g>
    <!-- Buds -->
    <ellipse cx="220" cy="55" rx="4" ry="7" transform="rotate(30, 220, 55)" fill="var(--auth-sakura-petal, #F8BBD0)" />
    <ellipse cx="445" cy="58" rx="3.5" ry="6" transform="rotate(-25, 445, 58)" fill="var(--auth-sakura-petal, #F8BBD0)" />
  </g>

  <!-- 11. PETALS -->
  <g id="auth-petals" fill="var(--auth-sakura-petal, #F8BBD0)">
    <path d="M 240 180 Q 248 170 256 180 Q 256 195 240 200 Q 236 188 240 180 Z" opacity="0.85" />
    <path d="M 330 220 Q 338 210 346 220 Q 346 235 330 240 Q 326 228 330 220 Z" opacity="0.75" />
    <path d="M 1240 220 Q 1248 212 1256 220 Q 1256 232 1240 236 Q 1236 226 1240 220 Z" opacity="0.65" />
  </g>
</svg>
